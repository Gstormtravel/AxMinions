# Com que frequência o plugin deve salvar todos os minions?
# O plugin salva as alterações em tempo real, isto serve apenas para atualizar as estatísticas dos minions no banco de dados.
# Para esta alteração ter efeito, você precisa reiniciar o seu servidor!
auto-save-minutes: 3

# Idioma das mensagens do plugin (arquivos em plugins/AxMinions/lang/<idioma>.yml)
# Disponíveis: pt_BR, en_US, es_ES, zh_CN, hi_IN, fr_FR, ar_SA, bn_BD, ru_RU, id_ID, de_DE
language: pt_BR

# Quão longe o baú de armazenamento pode estar do minion
max-linking-distance: 30

# Se os jogadores precisam ter a permissão 'axminions.place.<minion>'
# para poderem colocar este minion
place-permissions: false

# A quantidade padrão de minions que um jogador pode ter.
# Esta configuração pode ser substituída definindo a permissão 'axminions.limit.<amount>'!
default-minion-limit: 5

# Se verdadeiro, apenas o dono deste minion pode quebrá-lo
# Se falso, todos que puderem quebrar blocos no referido local poderão quebrar este minion
# Você deve ativar isto se não estiver usando um plugin de proteção compatível!
only-owner-break: true

# Se verdadeiro, apenas o dono deste minion pode abrir a interface dele
# Se falso, todos que puderem quebrar blocos no referido local poderão abrir a interface deste minion
# Você deve ativar isto se não estiver usando um plugin de proteção compatível!
only-owner-gui: true

# Os minions devem mostrar hologramas se tiverem algum problema?
# (Eles não vão reclamar sobre não terem uma namorada, no entanto!)
# Você pode configurar estas mensagens no messages.yml
display-warnings: true

# Se definido como verdadeiro, o minion não quebrará a ferramenta, ela ficará apenas com 1 de durabilidade (e o minion será parado)
# Se definido como falso, o minion pode quebrar a ferramenta
can-break-tools: true

# O limite a ser usado para ilhas
island-limit: 10

# Se o minion deve ser capaz de retirar durabilidade do item que está segurando
use-durability: true

# Se o minion deve puxar novas ferramentas do baú ao qual está conectado
pull-tools-from-chest: false

# Se o minion deve trabalhar quando o dono estiver offline (apenas se a chunk estiver carregada)
work-when-owner-offline: true

# A quantidade máxima de blocos que um único minion lenhador pode quebrar por vez
max-breaks-per-tick: 200

# Que tipo de mensagem devemos enviar quando a melhoria falhar
# devido a fundos insuficientes
# Opções possíveis: chat, title, subtitle, actionbar
upgrade-fail: "chat"

# O som reproduzido quando você melhora um minion
# defina como "" para desativar!
# Para uma lista de sons visite: https://jd.papermc.io/paper/1.20/org/bukkit/Sound.html
upgrade-sound: "ENTITY_PLAYER_LEVELUP"

database:
  # Pode ser H2 (Suporte a Sqlite está planejado)
  type: "H2"

hooks:
  # Plugins de stacker suportados: WildStacker, RoseStacker, ItemStacker, none
  stacker: "none"
  # Provedores de economia suportados: Vault, PlayerPoints, custom
  economy: "Vault"
  # Provedores de preços suportados: HeroVender, ShopGUIPlus, Essentials, EconomyShopGUI, CMI, custom
  prices: "HeroVender"

charge:
  enabled: false
  amount: 1800 # em segundos
  max-charge: 1440 # em minutos
  price: 10000
  minimum-charge: 30 # em segundos
  items:
    1:
      type: cooked_beef
      name: "<red>Combustível"
      charge: 1000 # Em segundos

# 1 - HH:MM:SS, por exemplo 01:25:35
# 2 - formato curto, por exemplo 20m
# 3 - formato de texto, por exemplo 01h 25m 35s
timer-format: 1

gui:
  size: 27
  items:
    filler:
      type: "black_stained_glass_pane"
      name: ""
    rotate:
      type: "ender_eye"
      name: "<#33FF33><b>Rotacionar"
      lore:
        - ""
        - " <gray>- <white>Atual: <#33FF33><direction>"
        - ""
        - "<#33FF33><b>(!)</b> Clique aqui para rotacionar o seu minion!"
      slot: 10
    link:
      type: "chest"
      name: "<#FFCC00><b>Vincular ao recipiente"
      lore:
        - ""
        - " <gray>- <white>Status: <#FFCC00><linked>"
        - ""
        - "<#FFCC00><b>(!)</b> Clique aqui para vincular o seu minion a um recipiente!"
      slot: 11
    item:
      type: "air"
      slot: 13
    charge:
      type: "lava_bucket"
      name: "<#FB8E08><b>Carregar"
      lore:
        - ""
        - " <gray>- <white>Carga atual: <#FFCC00><charge>"
        - ""
        - "<#FB8E08><b>(!)</b> Clique aqui para carregar o seu minion por <white>30 minutos</white>!"
      slot: 9

    # Estas configurações são específicas de cada minion, você pode editá-las no arquivo de cada minion!
    upgrade:
      slot: 15
    statistics:
      slot: 16
    abilities:
      type: nether_star
      name: <#00EEFF><b>✦ Habilidades & Pontos
      lore:
      - ''
      - ' <gray>- <white>Pontos disponíveis: <#55FF55><skill_points>'
      - ''
      - ' <gray>Cada nível concede pontos para evoluir'
      - ' <gray>atributos e desbloquear poderes especiais!'
      - ''
      - <#00EEFF><b>(!)</b> Clique aqui para abrir a árvore de habilidades!
      slot: 14
    pickup:
      type: chest_minecart
      name: <#FF5555><b>⛏ Recolher Minion
      lore:
      - ''
      - ' <gray>Escolha entre recolher o minion'
      - ' <gray>com ou sem a ferramenta guardada.'
      - ''
      - <#FF5555><b>(!)</b> Clique aqui para escolher como recolher!
      slot: 22
    menu_switch:
      type: comparator
      name: <#00CCFF><b>🔄 Trocar para Menu Moderno
      lore:
      - ''
      - ' <gray>Alterna este menu clássico para o'
      - ' <aqua>Painel Nativo Moderno (Dialog)</aqua>!'
      - ''
      - <#00CCFF><b>(!)</b> Clique aqui para alternar o estilo do menu!
      slot: 26

# Sistema de Menu Moderno (Vanilla Dialog API estilo EliteMobs)
# true  = Ativa o sistema de menu novo para jogadores Java 1.21.6+ (Bedrock continua recebendo GUI automaticamente)
# false = Desativa o menu novo globalmente; todos os jogadores utilizam apenas o menu GUI clássico
use-dialog-menu: true

# Altere isto apenas se lhe for pedido! Isto tornará o seu desempenho pior e enviará mensagens de spam no seu console!
# Requer reinicialização!
debug: false

# Não alterar!
config-version: 11