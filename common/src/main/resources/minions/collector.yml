skill-system:
  enabled: true
  points-per-level: 1
  bonus-points-levels: [5, 10, 15, 20]
  respec-cost-money: 1000000
  stats:
    speed:
      display-name: '<#FFFF55>Frequência de Coleta'
      description:
      - '<gray>Reduz o intervalo entre varreduras (-10 ticks/tier).'
      material: REDSTONE
      slot: 10
      max-tier: 6
      cost-per-tier: [1, 1, 1, 1, 1, 1]
      modifier-per-tier: -10
      min-speed-floor: 65
    range:
      display-name: '<#FFAA00>Raio Magnético'
      description:
      - '<gray>Expande a área de coleta no chão (+1.0/tier).'
      material: COMPASS
      slot: 11
      max-tier: 4
      cost-per-tier: [2, 2, 3, 3]
      modifier-per-tier: 1.0
      max-range-cap: 6.0
    durability_save:
      display-name: '<#55FF55>Conservação'
      description:
      - '<gray>Chance de preservar a ferramenta (+12.5%/tier).'
      material: ANVIL
      slot: 12
      max-tier: 4
      cost-per-tier: [1, 1, 1, 1]
      chance-per-tier: 12.5
    storage:
      display-name: '<#FFFF55>Reserva de XP'
      description:
      - '<gray>Aumenta a capacidade de XP armazenado (+25%/tier).'
      material: EXPERIENCE_BOTTLE
      slot: 13
      max-tier: 5
      cost-per-tier: [1, 1, 1, 1, 1]
      modifier-per-tier: 0.25

custom-abilities:
  aspirador_xp:
    enabled: true
    slot: 19
    material: EXPERIENCE_BOTTLE
    display-name: '<#AADD00>Aspirador de XP'
    description:
    - '<gray>Absorve orbes de experiência próximos do chão'
    - '<gray>e guarda no tanque interno do minion.'
    min-level: 10
    max-tier: 3
    cost-per-tier: [2, 2, 3]
    trigger: ON_ACTION
    chance: 100
    effects:
    - type: XP_VACUUM
  compactador_coleta:
    enabled: true
    slot: 21
    material: HOPPER
    display-name: '<#55FFFF>Compactador de Coleta'
    description:
    - '<gray>Converte itens coletados em blocos 9x/4x'
    - '<gray>compactos dentro do baú vinculado.'
    min-level: 15
    max-tier: 2
    cost-per-tier: [3, 3]
    trigger: ON_ACTION
    chance: 50
    chance-per-tier: 50
    effects:
    - type: AUTO_COMPACT
  xp_vacuum:
    enabled: true
    slot: 23
    material: LAPIS_LAZULI
    display-name: '<#55EEFF>Aspirador Arcano'
    description:
    - '<gray>Executa sucção contínua de orbes de XP no'
    - '<gray>entorno mesmo entre varreduras.'
    min-level: 11
    max-tier: 3
    cost-per-tier: [2, 2, 3]
    trigger: ON_PERIODIC
    chance: 100
    cooldown-seconds: 3
    effects:
    - type: CONTINUOUS_VACUUM
  void_trash:
    enabled: true
    slot: 25
    material: LAVA_BUCKET
    display-name: '<#FF6655>Filtro de Sucata'
    description:
    - '<gray>Descarta automaticamente itens sem valor'
    - '<gray>(sementes, carne podre, batata podre) do chão.'
    min-level: 13
    max-tier: 2
    cost-per-tier: [3, 3]
    trigger: ON_ACTION
    chance: 100
    effects:
    - type: VOID_TRASH
      items:
      - ROTTEN_FLESH
      - POISONOUS_POTATO
      - WHEAT_SEEDS
      - BEETROOT_SEEDS
      - BOWL
  compact_chest:
    enabled: true
    slot: 28
    material: CHEST
    display-name: '<#FFCC55>Prensa de Estoque'
    description:
    - '<gray>Varre o baú vinculado periodicamente para'
    - '<gray>compactar minérios, pepitas e redstone 9x.'
    min-level: 15
    max-tier: 3
    cost-per-tier: [2, 2, 3]
    trigger: ON_PERIODIC
    chance: 100
    cooldown-seconds: 5
    effects:
    - type: CHEST_AUTO_COMPRESS
  overflow_teleporter:
    enabled: true
    slot: 30
    material: ENDER_CHEST
    display-name: '<#AA55FF>Transbordo Dimensional'
    description:
    - '<gray>Quando o baú encher, envia o excedente para o'
    - '<gray>Baú do Fim (EnderChest) do dono se estiver online.'
    min-level: 16
    max-tier: 2
    cost-per-tier: [3, 3]
    trigger: ON_ACTION
    chance: 100
    effects:
    - type: OVERFLOW_TO_ENDERCHEST
  stack_merger:
    enabled: true
    slot: 32
    material: SLIME_BALL
    display-name: '<#55FF88>Condensador Rápido'
    description:
    - '<gray>Reúne itens soltos e o próximo pacote no chão'
    - '<gray>para reduzir entidades e proteger o TPS.'
    min-level: 18
    max-tier: 2
    cost-per-tier: [3, 3]
    trigger: ON_PERIODIC
    chance: 100
    cooldown-seconds: 4
    effects:
    - type: MERGE_GROUND_ITEMS
  dimensional_pull:
    enabled: true
    slot: 34
    material: ENDER_PEARL
    display-name: '<#00CCFF>Singularidade'
    description:
    - '<gray>Expande passivamente o raio magnético em'
    - '<gray>+2.0 blocos por tier em todas as direções.'
    min-level: 19
    max-tier: 3
    cost-per-tier: [3, 3, 4]
    trigger: ON_ACTION
    chance: 100
    effects:
    - type: COLLECTOR_RANGE_BOOST
      amount: 2.0
config-version: 2
