custom-abilities:
  forja_lote:
    enabled: true
    slot: 19
    material: CRAFTING_TABLE
    display-name: '<#FFAA33>Forja em Lote'
    description:
    - '<gray>Permite fabricar múltiplos itens da receita'
    - '<gray>por ciclo (economiza ticks do servidor).'
    min-level: 8
    max-tier: 3
    cost-per-tier: [2, 2, 3]
    trigger: ON_ACTION
    chance: 100
    effects:
    - type: BATCH_CRAFT
      amount: 3
  obra_prima:
    enabled: true
    slot: 21
    material: ANVIL
    display-name: '<#55FF55>Obra-Prima'
    description:
    - '<gray>Chance de produzir 1 item bônus extra'
    - '<gray>sem consumir ingredientes adicionais.'
    min-level: 15
    max-tier: 3
    cost-per-tier: [2, 3, 3]
    trigger: ON_ACTION
    chance: 10
    chance-per-tier: 10
    effects:
    - type: MULTIPLY_DROPS
      factor: 2.0
  multi_output:
    enabled: true
    slot: 23
    material: PISTON
    display-name: '<#FFDD55>Duplicação de Bancada'
    description:
    - '<gray>Chance adicional de gerar 1 unidade extra por'
    - '<gray>receita sem gastar mais recursos.'
    min-level: 11
    max-tier: 3
    cost-per-tier: [2, 2, 3]
    trigger: ON_ACTION
    chance: 6
    chance-per-tier: 7
    effects:
    - type: MULTIPLY_DROPS
      factor: 2.0
  auto_smelt_craft:
    enabled: true
    slot: 25
    material: BLAST_FURNACE
    display-name: '<#FF6600>Forja Integrada'
    description:
    - '<gray>Converte automaticamente saídas brutas compatíveis'
    - '<gray>em barras cozidas ou vidro ao finalizar o craft.'
    min-level: 12
    max-tier: 2
    cost-per-tier: [3, 3]
    trigger: ON_ACTION
    chance: 100
    effects:
    - type: AUTO_SMELT
  compact_blocks:
    enabled: true
    slot: 28
    material: DISPENSER
    display-name: '<#55FFFF>Compactador Automático'
    description:
    - '<gray>Compacta sobras de lingotes/gemas do baú em'
    - '<gray>blocos completos após o término dos crafts.'
    min-level: 14
    max-tier: 3
    cost-per-tier: [2, 2, 3]
    trigger: ON_ACTION
    chance: 100
    effects:
    - type: AUTO_COMPACT
  byproduct_recycle:
    enabled: true
    slot: 30
    material: HOPPER
    display-name: '<#88FF88>Reaproveitamento'
    description:
    - '<gray>Chance de economizar e preservar 1 ingrediente'
    - '<gray>da receita durante a fabricação.'
    min-level: 16
    max-tier: 3
    cost-per-tier: [2, 3, 3]
    trigger: ON_ACTION
    chance: 15
    chance-per-tier: 15
    effects:
    - type: RECYCLE_INGREDIENT
  master_artisan:
    enabled: true
    slot: 32
    material: ENCHANTING_TABLE
    display-name: '<#DD66FF>Ritmo de Mestre'
    description:
    - '<gray>Acelera permanentemente o tempo de ciclo do'
    - '<gray>Artesão em -15%/tier (até -30%).'
    min-level: 18
    max-tier: 2
    cost-per-tier: [3, 3]
    trigger: ON_ACTION
    chance: 100
    effects:
    - type: ASSEMBLY_SPEED_REDUCE
      amount: 0.15
  assembly_line:
    enabled: true
    slot: 34
    material: REDSTONE_BLOCK
    display-name: '<#FF4444>Linha de Montagem'
    description:
    - '<gray>Adiciona +10/+20 receitas em cadeia por ciclo'
    - '<gray>para produção em escala industrial.'
    min-level: 20
    max-tier: 2
    cost-per-tier: [4, 4]
    trigger: ON_ACTION
    chance: 100
    effects:
    - type: BATCH_CRAFT
      amount: 10.0
