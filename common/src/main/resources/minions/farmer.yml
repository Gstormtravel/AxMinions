skill-system:
  enabled: true
  points-per-level: 1
  bonus-points-levels: [5, 10, 15, 20]
  respec-cost-money: 1000000
  stats:
    speed:
      display-name: '<#55FF55>Velocidade de Colheita'
      description:
      - '<gray>Reduz o intervalo entre colheitas (-10 ticks/tier).'
      material: REDSTONE
      slot: 10
      max-tier: 6
      cost-per-tier: [1, 1, 1, 1, 1, 1]
      modifier-per-tier: -10
      min-speed-floor: 80
    range:
      display-name: '<#FFAA00>Alcance de Plantação'
      description:
      - '<gray>Expande o raio de colheita (+0.75/tier).'
      material: DIAMOND_HOE
      slot: 11
      max-tier: 4
      cost-per-tier: [2, 2, 3, 3]
      modifier-per-tier: 0.75
      max-range-cap: 4.0
    durability_save:
      display-name: '<#55FF55>Cabo Reforçado'
      description:
      - '<gray>Chance de preservar a enxada (+12.5%/tier).'
      material: ANVIL
      slot: 12
      max-tier: 4
      cost-per-tier: [1, 1, 1, 1]
      chance-per-tier: 12.5
    storage:
      display-name: '<#FFFF55>Reserva de XP'
      description:
      - '<gray>Aumenta a capacidade de XP armazenado (+25%/tier).'
      material: EXPERIENCE_BOTTLE
      slot: 13
      max-tier: 5
      cost-per-tier: [1, 1, 1, 1, 1]
      modifier-per-tier: 0.25

