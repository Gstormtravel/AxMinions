custom-drops-max-per-catch: 1

# Drops Customizados do Minion Pescador
# Parametros disponiveis por entrada:
#   enabled: true/false
#   chance: probabilidade base em % (ex: 5.0 = 5%, 0.25 = 0.25%)
#   luck-bonus: % extra adicionada por cada nivel de Sorte do Mar (Luck of the Sea) na vara
#   min-level: nivel minimo do minion para poder pescar este drop
#   min-luck: nivel minimo de Sorte do Mar exigido na vara
#   min-amount / max-amount: quantidade sorteada do item
#   replace-vanilla: se true, substitui o peixe/tesouro padrao desta pescada; se false, vai junto como bonus
#   executable-item: ID exato de um item do plugin ExecutableItems (ignora material/name/lore abaixo se usado)
#   material: Material do Bukkit (quando nao usar executable-item)
#   name / lore / glow / enchantments: personalizacao opcional para itens Bukkit
