      description:
      - '<gray>Expande o raio de busca por troncos (+0.75/tier).'
      material: DIAMOND_AXE
      slot: 11
      max-tier: 4
      cost-per-tier: [2, 2, 3, 3]
      modifier-per-tier: 0.75
      max-range-cap: 5.0
