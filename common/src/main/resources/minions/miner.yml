skill-system:
  enabled: true
  points-per-level: 1
  bonus-points-levels: [5, 10, 15, 20]
  respec-cost-money: 1000000
  stats:
    speed:
      display-name: '<#00AAFF>Velocidade de Mineração'
      description:
      - '<gray>Reduz o intervalo entre ações (-15 ticks/tier).'
      - '<gray>Piso mínimo de segurança: 50 ticks.'
      material: REDSTONE
      slot: 10
      max-tier: 6
      cost-per-tier: [1, 1, 1, 1, 1, 1]
      modifier-per-tier: -15
      min-speed-floor: 50
    range:
      display-name: '<#FFAA00>Alcance de Escavação'
      description:
      - '<gray>Aumenta quantos blocos à frente o minion quebra (+1/tier).'
      - '<gray>Custo mais alto para proteger o TPS do servidor.'
      material: IRON_PICKAXE
      slot: 11
      max-tier: 4
      cost-per-tier: [2, 2, 3, 3]
      modifier-per-tier: 1.0
      max-range-cap: 5.0
    durability_save:
      display-name: '<#55FF55>Preservação de Picareta'
      description:
      - '<gray>Chance de não gastar durabilidade (+12.5%/tier).'
      material: ANVIL
      slot: 12
      max-tier: 4
      cost-per-tier: [1, 1, 1, 1]
      chance-per-tier: 12.5
    storage:
      display-name: '<#FFFF55>Reserva de XP'
      description:
      - '<gray>Aumenta a capacidade de XP armazenado (+25%/tier).'
      material: EXPERIENCE_BOTTLE
      slot: 13
      max-tier: 5
      cost-per-tier: [1, 1, 1, 1, 1]
      modifier-per-tier: 0.25

custom-abilities:
  fornalha_abissal:
    enabled: true
    slot: 19
    material: BLAZE_POWDER
    display-name: '<#FF6600>Fornalha Abissal'
    description:
    - '<gray>Derrete automaticamente minérios de ferro,'
    - '<gray>ouro, cobre e detritos ancestrais ao minerar.'
    min-level: 8
    max-tier: 3
    cost-per-tier: [2, 2, 3]
    trigger: ON_ACTION
    chance: 40
    chance-per-tier: 30
    effects:
    - type: AUTO_SMELT
  compactador_mineral:
    enabled: true
    slot: 21
    material: PISTON
    display-name: '<#55FFFF>Compactador Mineral'
    description:
    - '<gray>Converte conjuntos de 9 lingotes/gemas em'
    - '<gray>blocos compactos dentro do baú vinculado.'
    min-level: 15
    max-tier: 2
    cost-per-tier: [3, 3]
    trigger: ON_ACTION
    chance: 50
    chance-per-tier: 50
    effects:
    - type: AUTO_COMPACT
  xp_magnet:
    enabled: true
    slot: 23
    material: EXPERIENCE_BOTTLE
    display-name: '<#AADD00>Núcleo de Experiência'
    description:
    - '<gray>Amplia a geração e captação de XP mineral'
    - '<gray>armazenado no tanque do minion (+25%/tier).'
    min-level: 11
    max-tier: 3
    cost-per-tier: [2, 2, 3]
    trigger: ON_ACTION
    chance: 100
    effects:
    - type: XP_BOOST
      factor: 1.25
  fossil_finder:
    enabled: true
    slot: 25
    material: PRISMARINE_SHARD
    display-name: '<#55CCFF>Olho de Geólogo'
    description:
    - '<gray>Chance de encontrar pepitas, quartzo, lápis'
    - '<gray>ou redstone extras em pedras e minérios.'
    min-level: 13
    max-tier: 3
    cost-per-tier: [2, 2, 3]
    trigger: ON_ACTION
    chance: 1.5
    chance-per-tier: 1.75
    effects:
    - type: BONUS_DROP
  compact_ore:
    enabled: true
    slot: 28
    material: BLAST_FURNACE
    display-name: '<#FFAA55>Prensa Mineral'
    description:
    - '<gray>Funde e compacta automaticamente em blocos'
    - '<gray>os minérios e barras armazenados no baú.'
    min-level: 14
    max-tier: 2
    cost-per-tier: [3, 3]
    trigger: ON_ACTION
    chance: 50
    chance-per-tier: 50
    effects:
    - type: ORE_COMPACT_SMELT
  obsidian_breaker:
    enabled: true
    slot: 30
    material: OBSIDIAN
    display-name: '<#AA55FF>Broca Criogênica'
    description:
    - '<gray>Quebra obsidiana e ardósia reforçada sem'
    - '<gray>desgaste extra e dobra o rendimento.'
    min-level: 16
    max-tier: 2
    cost-per-tier: [3, 3]
    trigger: ON_ACTION
    chance: 50
    chance-per-tier: 50
    effects:
    - type: OBSIDIAN_EXTRA_BREAK
  treasure_geode:
    enabled: true
    slot: 32
    material: AMETHYST_SHARD
    display-name: '<#FF55FF>Geodo Abissal'
    description:
    - '<gray>Pequena chance de extrair fragmentos raros'
    - '<gray>como ametista, diamante bruto ou esmeralda.'
    min-level: 18
    max-tier: 3
    cost-per-tier: [3, 3, 4]
    trigger: ON_ACTION
    chance: 0.4
    chance-per-tier: 0.3
    effects:
    - type: RANDOM_MINERAL_CHEST
  overdrive_pulse:
    enabled: true
    slot: 34
    material: CLOCK
    display-name: '<#FFEE55>Pulso de Sobrecarga'
    description:
    - '<gray>Ativa ciclos acelerados consecutivos de'
    - '<gray>escavação quando o pulso dispara.'
    min-level: 20
    max-tier: 2
    cost-per-tier: [4, 4]
    trigger: ON_ACTION
    chance: 10
    chance-per-tier: 10
    cooldown-seconds: 20
    effects:
    - type: SPEED_PULSE
