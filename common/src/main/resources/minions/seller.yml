      material: GOLD_BLOCK
      slot: 12
      max-tier: 5
      cost-per-tier: [1, 1, 1, 1, 1]
      modifier-per-tier: 0.25

custom-abilities:
  deposito_vault:
    enabled: true
    slot: 19
    material: EMERALD
    display-name: '<#55FF55>Depósito Direto (Vault)'
    description:
