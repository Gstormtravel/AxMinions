skill-system:
  enabled: true
  points-per-level: 1
  bonus-points-levels: [5, 10, 15, 20]
  respec-cost-money: 1000000
  stats:
    speed:
      display-name: '<#DD55FF>Agilidade de Venda'
      description:
      - '<gray>Reduz o intervalo entre ciclos de venda (-35 ticks/tier).'
      material: REDSTONE
      slot: 10
      max-tier: 6
      cost-per-tier: [1, 1, 1, 1, 1, 1]
      modifier-per-tier: -35
      min-speed-floor: 90
    multiplier:
      display-name: '<#FFD700>Margem de Lucro'
      description:
      - '<gray>Aumenta o multiplicador de venda (+0.08x/tier).'
