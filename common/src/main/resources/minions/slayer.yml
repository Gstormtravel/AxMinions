skill-system:
  enabled: true
  points-per-level: 1
  bonus-points-levels: [5, 10, 15, 20]
  respec-cost-money: 1000000
  stats:
    speed:
      display-name: '<#FF5555>Cadência de Golpes'
      description:
      - '<gray>Reduz o intervalo entre ataques (-15 ticks/tier).'
      material: REDSTONE
      slot: 10
      max-tier: 6
      cost-per-tier: [1, 1, 1, 1, 1, 1]
      modifier-per-tier: -15
      min-speed-floor: 55
    range:
      display-name: '<#FFAA00>Alcance da Lâmina'
      description:
      - '<gray>Aumenta o alcance para localizar mobs (+0.75/tier).'
      material: DIAMOND_SWORD
      slot: 11
      max-tier: 4
      cost-per-tier: [2, 2, 3, 3]
      modifier-per-tier: 0.75
      max-range-cap: 5.0
    durability_save:
      display-name: '<#55FF55>Lâmina Inquebrável'
      description:
      - '<gray>Chance de preservar a espada (+12.5%/tier).'
      material: ANVIL
      slot: 12
      max-tier: 4
      cost-per-tier: [1, 1, 1, 1]
      chance-per-tier: 12.5
    storage:
      display-name: '<#FFFF55>Reserva de XP'
      description:
      - '<gray>Aumenta a capacidade de XP armazenado (+25%/tier).'
      material: EXPERIENCE_BOTTLE
      slot: 13
      max-tier: 5
      cost-per-tier: [1, 1, 1, 1, 1]
      modifier-per-tier: 0.25

custom-abilities:
  coleta_direta:
    enabled: true
    slot: 19
    material: ENDER_CHEST
    display-name: '<#AA55FF>Coleta Direta'
    description:
    - '<gray>Envia o loot do mob abatido diretamente para'
    - '<gray>o baú vinculado sem sequer cair no chão.'
    min-level: 10
    max-tier: 2
    cost-per-tier: [3, 3]
    trigger: ON_ACTION
    chance: 50
    chance-per-tier: 50
    effects:
    - type: DIRECT_TO_CHEST
  golpe_wildstacker:
    enabled: true
    slot: 21
    material: NETHERITE_SWORD
    display-name: '<#FF3355>Golpe WildStacker'
    description:
    - '<gray>Chance de eliminar mobs adicionais por golpe'
    - '<gray>em stacks de entidades do WildStacker.'
    min-level: 16
    max-tier: 3
    cost-per-tier: [3, 3, 4]
    trigger: ON_ACTION
    chance: 35
    chance-per-tier: 25
    effects:
    - type: MULTI_KILL_STACK
      amount: 1
  looting_edge:
    enabled: true
    slot: 23
    material: ENCHANTED_BOOK
    display-name: '<#FFAA00>Corte Saqueador'
    description:
    - '<gray>Adiciona rolagens extras equivalentes a Saque'
    - '<gray>nos drops de todos os mobs abatidos.'
    min-level: 11
    max-tier: 3
    cost-per-tier: [2, 2, 3]
    trigger: ON_ACTION
    chance: 20
    chance-per-tier: 20
    effects:
    - type: BONUS_LOOTING_ROLL
  soul_drain:
    enabled: true
    slot: 25
    material: SOUL_LANTERN
    display-name: '<#55FFFF>Sifão de Almas'
    description:
    - '<gray>Amplifica em +28%/tier o XP capturado por'
    - '<gray>abate de mobs e stacks.'
    min-level: 13
    max-tier: 3
    cost-per-tier: [2, 2, 3]
    trigger: ON_ACTION
    chance: 100
    effects:
    - type: XP_BOOST
      factor: 1.28
  head_hunter:
    enabled: true
    slot: 28
    material: SKELETON_SKULL
    display-name: '<#FFDD55>Colecionador de Troféus'
    description:
    - '<gray>Chance de dropar cabeças decorativas ao'
    - '<gray>abater esqueletos, zumbis, creepers ou wither.'
    min-level: 15
    max-tier: 2
    cost-per-tier: [3, 3]
    trigger: ON_ACTION
    chance: 1.0
    chance-per-tier: 1.5
    effects:
    - type: MOB_HEAD_DROP
  shockwave_cleave:
    enabled: true
    slot: 30
    material: IRON_AXE
    display-name: '<#FF5555>Onda de Impacto'
    description:
    - '<gray>Golpe em área que atinge múltiplos alvos'
    - '<gray>adicionais ao redor do minion no mesmo ciclo.'
    min-level: 17
    max-tier: 3
    cost-per-tier: [2, 3, 3]
    trigger: ON_ACTION
    chance: 35
    chance-per-tier: 25
    effects:
    - type: AOE_CLEAVE
      count: 2
  rare_essence:
    enabled: true
    slot: 32
    material: GHAST_TEAR
    display-name: '<#DD55FF>Extração de Essência'
    description:
    - '<gray>Chance de extrair lágrimas de ghast, varas de'
    - '<gray>blaze ou membranas extras de mobs hostis.'
    min-level: 19
    max-tier: 3
    cost-per-tier: [3, 3, 4]
    trigger: ON_ACTION
    chance: 2.0
    chance-per-tier: 2.5
    effects:
    - type: MOB_RARE_LOOT
  executioner_frenzy:
    enabled: true
    slot: 34
    material: NETHER_STAR
    display-name: '<#FF2244>Frenesi do Executor'
    description:
    - '<gray>Chance de executar imediatamente um segundo'
    - '<gray>golpe fulminante sobre o alvo no mesmo tick.'
    min-level: 20
    max-tier: 2
    cost-per-tier: [4, 4]
    trigger: ON_ACTION
    chance: 15
    chance-per-tier: 15
    cooldown-seconds: 12
    effects:
    - type: EXECUTIONER_FRENZY
