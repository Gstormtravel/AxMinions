# ============================================================
#  AxMinions — gradle.properties (Root)
# ============================================================

# --- JVM & Encoding ---
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+UseParallelGC -Dfile.encoding=UTF-8
systemProp.file.encoding=UTF-8
org.gradle.java.installations.auto-detect=true

# --- Performance ---
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# --- Configuration Cache (Desligue se quebrar submódulos antigos) ---
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

# --- Kotlin ---
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2G -XX:+UseParallelGC
kotlin.incremental=true
# Mantenha esta linha para não quebrar os módulos v1_20, v1_21 etc:
kotlin.jvm.target.validation.mode=ignore

# --- Logs ---
org.gradle.warning.mode=summary